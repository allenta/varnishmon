name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: 0 5 * * 1

env:
  GO_VERSION: 1.26.4

permissions:
  actions: write
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }} ${{ matrix.architecture }})

    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    strategy:
      matrix:
        platform:
          - resolute
          - noble
          - jammy
          - trixie
          - bookworm
          - rhel10
          - rhel9
        architecture:
          - amd64
          - arm64

    steps:
      - uses: actions/checkout@v7

      - uses: ./extras/github/build-action
        with:
          platform: ${{ matrix.platform }}
          architecture: ${{ matrix.architecture }}
          go-version: ${{ env.GO_VERSION }}

  release:
    needs:
      - build

    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

    name: Release

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Beware 'Settings' > 'Actions' > 'General' > 'Workflow permissions' >
      # 'Read and write permissions' is required for this to work.
      - shell: bash
        run: |
          gh release create \
            "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            $(find ./artifacts/*-*-artifacts -type f -maxdepth 1)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
