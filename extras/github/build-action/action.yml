name: Build

inputs:
  platform:
    required: true
  architecture:
    required: true
  go-version:
    required: true

runs:
  using: composite

  steps:
    # Try to populate 'duckdb-static-bundle/libduckdb_bundle.a' from cache. This
    # will only succeed for platforms + architectures building their own DuckDB
    # static bundle (currently, only RHEL 8 + AMD64).
    - uses: actions/cache/restore@v5
      id: duckdb-static-bundle-restore
      with:
        path: duckdb-static-bundle/libduckdb_bundle.a
        key: ${{ inputs.platform }}-${{ inputs.architecture }}-${{ hashFiles('Makefile') }}-duckdb-static-bundle


    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # docker build \
    #   --quiet \
    #   --platform linux/${{ inputs.architecture }} \
    #   --file extras/github/docker/Dockerfile-${{ inputs.platform }} \
    #   --build-arg GO_VERSION=${{ inputs.go-version }} \
    #   --tag varnishmon-dev \
    #   .)
    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: extras/github/docker/Dockerfile-${{ inputs.platform }}
        platforms: linux/${{ inputs.architecture }}
        load: true
        tags: varnishmon-dev
        build-args: GO_VERSION=${{ inputs.go-version }}
        cache-from: type=gha,scope=${{ inputs.platform }}-${{ inputs.architecture }}-${{ inputs.go-version }}
        cache-to: type=gha,mode=max,scope=${{ inputs.platform }}-${{ inputs.architecture }}-${{ inputs.go-version }}

    - shell: bash
      id: build
      run: |
        set -e

        docker run \
          --rm \
          --platform linux/${{ inputs.architecture }} \
          --volume ${{ github.workspace }}:/workspace \
          --workdir /workspace \
          varnishmon-dev \
          bash -c ' \
            set -e; \
            git config --global --add safe.directory /workspace; \
            export PATH=/usr/local/go/bin:$PATH; \
            export PLATFORM=${{ inputs.platform }}; \
            make lint vet test package'

        if [ -f duckdb-static-bundle/libduckdb_bundle.a ]; then
          echo 'duckdb-static-bundle-exists=true' >> $GITHUB_OUTPUT
        else
          echo 'duckdb-static-bundle-exists=false' >> $GITHUB_OUTPUT
        fi

    # Save 'duckdb-static-bundle/libduckdb_bundle.a' to cache if it was not
    # restored from cache. The file won't exist for platforms + architectures
    # that don't build their own DuckDB static bundle.
    - uses: actions/cache/save@v5
      if: |
        steps.duckdb-static-bundle-restore.outputs.cache-hit != 'true' &&
        steps.build.outputs.duckdb-static-bundle-exists == 'true'
      with:
        path: duckdb-static-bundle/libduckdb_bundle.a
        key: ${{ steps.duckdb-static-bundle-restore.outputs.cache-primary-key }}

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.platform }}-${{ inputs.architecture }}-artifacts
        path: |
          build/varnishmon-*.tgz
          build/varnishmon_*.deb
          build/varnishmon-*.rpm
        retention-days: 1
